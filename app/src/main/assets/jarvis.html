/* ================= BOOT ================= */

#boot {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #09080d;
    z-index: 10;
    transition: opacity .35s ease;
}

.boot {
    text-align: center;
}

.ring {
    width: 150px;
    height: 150px;
    border: 1px solid #aaa;
    border-radius: 50%;
    box-shadow: 0 0 35px #666;
    animation: pulse 1s infinite;
}

.bootText {
    margin-top: 25px;
    font: 12px Arial, sans-serif;
    letter-spacing: 5px;
    color: #bbb;
}

@keyframes pulse {
    50% {
        transform: scale(1.08);
        opacity: .6;
    }
}
