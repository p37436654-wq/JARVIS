<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>JARVIS</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #08080d;
            color: #f5f3f7;
        }

        body {
            font-family: Georgia, "Times New Roman", serif;
        }

        button,
        input {
            font-family: inherit;
        }

        button {
            cursor: pointer;
        }

        .screen {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        /* BOOT */

        #bootScreen {
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(
                    circle at center,
                    #181821 0%,
                    #0b0b10 45%,
                    #050509 100%
                );
            z-index: 100;
            transition: opacity 0.45s ease;
        }

        .bootContent {
            text-align: center;
        }

        .bootRing {
            width: 150px;
            height: 150px;
            margin: auto;
            border: 1px solid #bdbdc5;
            border-radius: 50%;
            box-shadow:
                0 0 15px rgba(255,255,255,.15),
                0 0 45px rgba(180,180,200,.15);
            animation: bootPulse 1.1s infinite ease-in-out;
        }

        .bootInner {
            position: relative;
            top: 50%;
            left: 50%;
            width: 7px;
            height: 7px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 20px #fff;
        }

        .bootText {
            margin-top: 28px;
            font-family: Arial, sans-serif;
            font-size: 11px;
            letter-spacing: 5px;
            color: #aaaab2;
        }

        .bootSub {
            margin-top: 10px;
            font-family: Arial, sans-serif;
            font-size: 9px;
            letter-spacing: 2px;
            color: #55555e;
        }

        @keyframes bootPulse {
            0% {
                transform: scale(.96);
                opacity: .7;
            }

            50% {
                transform: scale(1.06);
                opacity: 1;
            }

            100% {
                transform: scale(.96);
                opacity: .7;
            }
        }

        /* SETUP */

        #setupScreen {
            display: none;
            align-items: center;
            justify-content: center;
            padding: 28px;
            background:
                radial-gradient(
                    circle at center,
                    #171720 0%,
                    #0b0b10 50%,
                    #06060a 100%
                );
            z-index: 50;
        }

        .setupCard {
            width: min(90%, 420px);
            text-align: center;
        }

        .setupLogo {
            font-family: Arial, sans-serif;
            font-size: 38px;
            font-weight: 700;
            letter-spacing: 8px;
        }

        .setupLine {
            width: 80px;
            height: 1px;
            margin: 20px auto;
            background: #55555e;
        }

        .setupQuestion {
            margin-bottom: 28px;
            color: #898993;
            font-family: Arial, sans-serif;
            font-size: 13px;
            line-height: 1.5;
        }

        #nameInput {
            display: block;
            width: 100%;
            height: 54px;
            padding: 0 18px;
            border: 1px solid #393941;
            border-radius: 14px;
            outline: none;
            background: #14141b;
            color: #fff;
            text-align: center;
            font-family: Arial, sans-serif;
            font-size: 16px;
        }

        #nameInput:focus {
            border-color: #9b9ba8;
            box-shadow: 0 0 20px rgba(180,180,200,.08);
        }

        #nameInput::placeholder {
            color: #55555f;
        }

        #continueButton {
            display: block;
            width: 100%;
            height: 54px;
            margin-top: 14px;
            border: 0;
            border-radius: 14px;
            background: #dedee8;
            color: #111116;
            font-family: Arial, sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        #continueButton:active {
            transform: scale(.97);
        }

        .setupHint {
            margin-top: 18px;
            color: #4e4e57;
            font-family: Arial, sans-serif;
            font-size: 10px;
        }

        /* HOME */

        #homeScreen {
            display: none;
            background:
                radial-gradient(
                    circle at 50% 38%,
                    #17171f 0%,
                    #0b0b10 38%,
                    #06060a 100%
                );
        }

        .topBar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 95px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .title {
            font-family: Arial, sans-serif;
            font-size: 29px;
            font-weight: 700;
            letter-spacing: 4px;
        }

        .topButton {
            position: absolute;
            top: 29px;
            width: 42px;
            height: 42px;
            border: 0;
            background: transparent;
            color: #a7a7b0;
            font-family: Arial, sans-serif;
            font-size: 23px;
        }

        #backButton {
            left: 10px;
        }

        #settingsButton {
            right: 10px;
        }

        .timeDisplay {
            position: absolute;
            top: 82px;
            left: 0;
            right: 0;
            text-align: center;
            color: #65656e;
            font-family: Arial, sans-serif;
            font-size: 10px;
            letter-spacing: 2px;
        }

        /* ORB */

        .orb {
            position: absolute;
            top: 34%;
            left: 50%;
            width: 330px;
            height: 330px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
        }

        .orbDot {
            position: absolute;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: #eeeeF2;
            opacity: .8;
            animation:
                dotFloat var(--duration)
                infinite alternate ease-in-out;
        }

        @keyframes dotFloat {
            from {
                transform: translate(0,0) scale(1);
                opacity: .9;
            }

            to {
                transform:
                    translate(var(--moveX),var(--moveY))
                    scale(.35);
                opacity: .25;
            }
        }

        .orbCore {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 9px;
            height: 9px;
            transform: translate(-50%,-50%);
            border-radius: 50%;
            background: #fff;
            box-shadow:
                0 0 15px #fff,
                0 0 35px rgba(255,255,255,.55);
            animation: corePulse 2s infinite ease-in-out;
        }

        @keyframes corePulse {
            0%,100% {
                transform: translate(-50%,-50%) scale(.8);
            }

            50% {
                transform: translate(-50%,-50%) scale(1.35);
            }
        }

        /* GREETING */

        #greeting {
            position: absolute;
            top: 57%;
            left: 15px;
            right: 15px;
            text-align: center;
            font-size: 36px;
            font-weight: 700;
        }

        #briefText {
            position: absolute;
            top: 65%;
            left: 15px;
            right: 15px;
            text-align: center;
            color: #777781;
            font-family: Arial, sans-serif;
            font-size: 15px;
        }

        /* MIC */

        #micButton {
            position: absolute;
            bottom: 7%;
            left: 50%;
            width: 92px;
            height: 92px;
            transform: translateX(-50%);
            border: 0;
            border-radius: 50%;
            background:
                radial-gradient(
                    circle,
                    #aaa9df 0%,
                    #8f90cf 70%,
                    #7778b5 100%
                );
            color: #fff;
            font-family: Arial, sans-serif;
            font-size: 34px;
            box-shadow:
                0 0 25px rgba(140,140,200,.2),
                0 0 50px rgba(100,100,150,.1);
        }

        #micButton:active {
            transform: translateX(-50%) scale(.93);
        }

        #micButton.listening {
            box-shadow:
                0 0 25px rgba(180,180,230,.5),
                0 0 65px rgba(150,150,220,.3);
            animation: micPulse 1s infinite;
        }

        @keyframes micPulse {
            50% {
                box-shadow:
                    0 0 35px rgba(210,210,255,.6),
                    0 0 80px rgba(150,150,220,.35);
            }
        }

        .status {
            position: absolute;
            bottom: 3%;
            left: 0;
            right: 0;
            text-align: center;
            color: #44444c;
            font-family: Arial, sans-serif;
            font-size: 8px;
            letter-spacing: 2px;
        }

        @media (max-height:650px) {

            .orb {
                top: 31%;
                transform:
                    translate(-50%,-50%)
                    scale(.78);
            }

            #greeting {
                top: 54%;
                font-size: 30px;
            }

            #briefText {
                top: 64%;
            }

            #micButton {
                bottom: 4%;
                width: 78px;
                height: 78px;
            }
        }
    </style>
</head>

<body>

    <!-- BOOT SCREEN -->

    <div id="bootScreen" class="screen">

        <div class="bootContent">

            <div class="bootRing">
                <div class="bootInner"></div>
            </div>

            <div class="bootText">
                INITIALIZING JARVIS
            </div>

            <div class="bootSub">
                PERSONAL ASSISTANT SYSTEM
            </div>

        </div>

    </div>


    <!-- NAME SETUP -->

    <div id="setupScreen" class="screen">

        <div class="setupCard">

            <div class="setupLogo">
                JARVIS
            </div>

            <div class="setupLine"></div>

            <div class="setupQuestion">
                Before we begin,<br>
                what should I call you?
            </div>

            <input
                id="nameInput"
                type="text"
                maxlength="30"
                autocomplete="off"
                autocorrect="off"
                autocapitalize="words"
                spellcheck="false"
                placeholder="Your name"
            >

            <button
                id="continueButton"
                type="button"
            >
                CONTINUE
            </button>

            <div class="setupHint">
                Your name is saved locally on this device.
            </div>

        </div>

    </div>


    <!-- MAIN HUD -->

    <div id="homeScreen" class="screen">

        <div class="topBar">

            <button
                id="backButton"
                class="topButton"
                type="button"
                aria-label="Back"
            >
                ‹
            </button>

            <div class="title">
                JARVIS
            </div>

            <button
                id="settingsButton"
                class="topButton"
                type="button"
                aria-label="Settings"
            >
                ⚙
            </button>

        </div>


        <div id="timeText" class="timeDisplay">
            --:--
        </div>


        <div id="orbElement" class="orb">

            <div class="orbCore"></div>

        </div>


        <div id="greeting">
            Welcome.
        </div>


        <div id="briefText">
            Initializing your assistant...
        </div>


        <button
            id="micButton"
            type="button"
            aria-label="Microphone"
        >
            ♫
        </button>


        <div class="status">
            JARVIS ONLINE
        </div>

    </div>


    <script>

        /* ELEMENTS */

        const bootScreen =
            document.getElementById("bootScreen");

        const setupScreen =
            document.getElementById("setupScreen");

        const homeScreen =
            document.getElementById("homeScreen");

        const nameInput =
            document.getElementById("nameInput");

        const continueButton =
            document.getElementById("continueButton");

        const greeting =
            document.getElementById("greeting");

        const briefText =
            document.getElementById("briefText");

        const timeText =
            document.getElementById("timeText");

        const orbElement =
            document.getElementById("orbElement");

        const micButton =
            document.getElementById("micButton");

        const backButton =
            document.getElementById("backButton");

        const settingsButton =
            document.getElementById("settingsButton");


        /* STORAGE */

        function getSavedName() {

            try {

                return (
                    localStorage.getItem("jarvis_name") || ""
                ).trim();

            } catch (error) {

                return "";

            }
        }


        function saveName(name) {

            try {

                localStorage.setItem(
                    "jarvis_name",
                    name
                );

            } catch (error) {

                console.log("Storage unavailable");

            }
        }


        /* TIME OF DAY */

        function getTimeOfDay() {

            const hour =
                new Date().getHours();

            if (hour >= 5 && hour < 12) {

                return {
                    greeting: "Good morning",
                    period: "morning"
                };

            }

            if (hour >= 12 && hour < 17) {

                return {
                    greeting: "Good afternoon",
                    period: "afternoon"
                };

            }

            return {
                greeting: "Good evening",
                period: "evening"
            };
        }


        /* CLOCK */

        function updateClock() {

            const now = new Date();

            let hours =
                now.getHours();

            const minutes =
                String(now.getMinutes())
                    .padStart(2,"0");

            const seconds =
                String(now.getSeconds())
                    .padStart(2,"0");

            const period =
                hours >= 12 ? "PM" : "AM";

            hours =
                hours % 12 || 12;

            timeText.textContent =
                String(hours).padStart(2,"0")
                + ":"
                + minutes
                + ":"
                + seconds
                + " "
                + period;
        }


        /* ORB */

        function createOrb() {

            const oldDots =
                orbElement.querySelectorAll(".orbDot");

            oldDots.forEach(function(dot) {

                dot.remove();

            });


            const fragment =
                document.createDocumentFragment();


            for (let i = 0; i < 330; i++) {

                const dot =
                    document.createElement("div");

                dot.className =
                    "orbDot";


                const angle =
                    Math.random() *
                    Math.PI *
                    2;

                const radius =
                    Math.sqrt(Math.random()) *
                    47;


                const x =
                    50 +
                    radius *
                    Math.cos(angle);

                const y =
                    50 +
                    radius *
                    Math.sin(angle);


                dot.style.left =
                    x + "%";

                dot.style.top =
                    y + "%";


                dot.style.setProperty(
                    "--duration",
                    (0.6 +
                    Math.random() * 2.4) +
                    "s"
                );


                dot.style.setProperty(
                    "--moveX",
                    ((Math.random() - 0.5) * 15) +
                    "px"
                );


                dot.style.setProperty(
                    "--moveY",
                    ((Math.random() - 0.5) * 15) +
                    "px"
                );


                fragment.appendChild(dot);
            }


            orbElement.appendChild(fragment);
        }


        /* SHOW HOME */

        function showHome(name) {

            saveName(name);

            setupScreen.style.display =
                "none";

            homeScreen.style.display =
                "block";


            const time =
                getTimeOfDay();


            greeting.textContent =
                time.greeting +
                ", " +
                name +
                ".";

if (window.AndroidJarvis && window.AndroidJarvis.speak) {
    window.AndroidJarvis.speak(
        time.greeting + ", " + name
    );
        }
            briefText.textContent =
                "Ask for your " +
                time.period +
                " brief";


            createOrb();

            updateClock();
        }


        /* CONTINUE */

        function continueSetup() {

            const name =
                nameInput.value.trim();


            if (!name) {

                nameInput.focus();

                return;
            }


            continueButton.disabled =
                true;


            showHome(name);


            setTimeout(function() {

                continueButton.disabled =
                    false;

            },300);
        }


        /* CONTINUE CLICK */

        continueButton.addEventListener(
            "click",
            continueSetup
        );


        /* ENTER KEY */

        nameInput.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    event.preventDefault();

                    continueSetup();

                }

            }
        );


        /* BACK */

        backButton.addEventListener(
            "click",
            function() {

                homeScreen.style.display =
                    "none";

                setupScreen.style.display =
                    "flex";

                nameInput.value =
                    getSavedName();

                nameInput.focus();

            }
        );


/* SETTINGS */

settingsButton.addEventListener(
    "click",
    function() {

        if (
            window.AndroidJarvis &&
            window.AndroidJarvis.openPhoneControls
        ) {

            window.AndroidJarvis.openPhoneControls();

        }

    }
);        
            

                
                    


        /* MICROPHONE */

micButton.addEventListener(
    "click",
    function() {

        micButton.classList.add(
            "listening"
        );

        if (
            window.AndroidJarvis &&
            window.AndroidJarvis.startListening
        ) {

            window.AndroidJarvis.startListening();

        }

        setTimeout(
            function() {

                micButton.classList.remove(
                    "listening"
                );

            },
            3000
        );

    }
);
                    
                

            
        


        /* CLOCK LOOP */

        updateClock();

        setInterval(
            updateClock,
            1000
        );


        /* BOOT */

        setTimeout(
            function() {

                bootScreen.style.opacity =
                    "0";


                setTimeout(
                    function() {

                        bootScreen.style.display =
                            "none";


                        const savedName =
                            getSavedName();


                        if (savedName) {

                            showHome(savedName);

                        } else {

                            setupScreen.style.display =
                                "flex";


                            setTimeout(
                                function() {

                                    nameInput.focus();

                                },
                                150
                            );

                        }

                    },
                    450
                );

            },
            2000
        );

    </script>

</body>
</html>
